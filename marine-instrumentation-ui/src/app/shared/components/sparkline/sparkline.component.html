<!-- SVG mode (default compact sparkline) -->
@if (mode === 'svg') {
  @if (hasPoints) {
    <svg [attr.viewBox]="viewBox" preserveAspectRatio="none" class="sparkline-svg">
      <polyline
        [attr.points]="points"
        fill="none"
        [attr.stroke]="stroke"
        stroke-width="2"
        vector-effect="non-scaling-stroke"
      />
      @if (thresholdY !== null) {
        <line
          [attr.x1]="0"
          [attr.x2]="width"
          [attr.y1]="thresholdY"
          [attr.y2]="thresholdY"
          class="sparkline-threshold"
        />
      }
    </svg>
  } @else {
    <div class="sparkline-empty">—</div>
  }
}

<!-- Scope mode (Canvas oscilloscope) -->
@if (mode === 'scope') {
  @if (data.length >= 2) {
    <canvas #scopeCanvas class="sparkline-canvas"></canvas>
  } @else {
    <div class="sparkline-empty">—</div>
  }
}
