name: OMI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  contract:
    name: Contract — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run test:contract
      - run: npm run build:contract

  simulator:
    name: Simulation Platform - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run build:simulator

  gateway:
    name: Gateway — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run test:gateway
      - run: npm run build:gateway

  autopilot:
    name: Autopilot — Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run test:autopilot
      - run: npm run build:autopilot

  simulation-platform:
    name: Simulation Platform - Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run test:simulation
      - run: npm run build:simulation

  chart-engine:
    name: Chart Engine — Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run test:charts
      - run: npm run build:charts

  tile-server:
    name: Tile Server — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run build:tile-server

  ui-lint:
    name: UI — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run lint -w marine-instrumentation-ui

  ui-test:
    name: UI — Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run test:ci -w marine-instrumentation-ui

  ui-build:
    name: UI — Production Build
    needs: [contract, ui-lint, ui-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root --legacy-peer-deps
      - run: npm run build:ui
      - name: Analyze bundle size
        run: |
          echo "=== Bundle Analysis ==="
          ls -lh marine-instrumentation-ui/dist/*/browser/*.js 2>/dev/null | awk '{print $5, $9}' | sort -h || echo "No JS bundles found"
          echo ""
          echo "=== Total Size ==="
          du -sh marine-instrumentation-ui/dist/ 2>/dev/null || echo "No dist folder"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omi-dist
          path: marine-instrumentation-ui/dist/
          retention-days: 7
